name: Windows Desktop Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: desktop-release-${{ github.ref }}

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install web dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Build Next standalone
              run: pnpm build

            - name: Install desktop dependencies
              working-directory: desktop
              run: pnpm install --ignore-workspace --no-frozen-lockfile

            - name: Fetch bundled runtimes
              working-directory: desktop
              run: pnpm fetch-runtimes
              env:
                  TONGFLOW_TARGET_ARCH: x64

            - name: Compile and assemble
              working-directory: desktop
              run: |
                  pnpm build:main
                  pnpm assemble

            - name: Smoke test
              working-directory: desktop
              run: pnpm smoke

            - name: Package and upload draft release
              working-directory: desktop
              run: pnpm exec electron-builder --win --x64 --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"

    publish:
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
